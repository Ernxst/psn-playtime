labels:
  - name: bug
    color: ee0701
    description: Something is broken or behaving incorrectly.
  - name: contribution welcome
    color: 0e8a16
    description: External contributions are welcome for this issue.
  - name: discussion
    color: 4935ad
    description: Needs design discussion or maintainer alignment before implementation.
  - name: docs
    color: 8be281
    description: Documentation, examples, or explanatory content.
  - name: enhancement
    color: a2eeef
    description: New feature or improvement to existing behavior.
  - name: good first issue
    color: 7057ff
    description: Small, well-scoped issue suitable for a first contribution.
  - name: help wanted
    color: 008672
    description: Maintainers would appreciate outside help on this issue.
  - name: question
    color: d876e3
    description: Needs an answer or clarification rather than implementation.
  - name: wontfix
    color: ffffff
    description: This issue will not be actioned.
  - name: needs-triage
    color: fbca04
    description: Maintainer or triage agent needs to evaluate and classify this issue.
  - name: needs-info
    color: d876e3
    description: Waiting on the reporter or maintainer for specific missing information.
  - name: ready-for-agent
    color: 0e8a16
    description: Fully specified and ready for an AFK coding agent.
  - name: ready-for-human
    color: 5319e7
    description: Requires human judgement, access, design direction, or manual validation.
  - name: WIP
    color: ffffff
    description: Work is in progress and not ready for final review.
  - name: need repro
    color: c9581c
    description: A reliable reproduction case is needed before the issue can proceed.
  - name: feature request
    color: fbca04
    description: Request for a new feature or capability.
