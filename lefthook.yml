assert_lefthook_installed: true
min_version: 2.1.6

commit-msg:
  commands:
    "lint commit message":
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    format:
      priority: 1
      glob: "*.{js,ts,jsx,tsx,json,css,md}"
      run: pnpm exec oxfmt --write {staged_files}
      stage_fixed: true

    lint:
      priority: 2
      # oxlint only lints JS/TS; passing it package.json/tsconfig (the only
      # staged file in a config-only commit) makes it exit 1 ("No files found
      # to lint"). Scope the trigger to code files so config-only commits skip.
      glob: "*.{js,ts,jsx,tsx}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true

    typecheck:
      glob:
        - "*.{js,ts,jsx,tsx}"
        - "**/tsconfig*.json"
        - "package.json"
        - "pnpm-lock.yaml"
      run: pnpm run typecheck

    knip:
      glob:
        - "package.json"
        - "pnpm-lock.yaml"
        - "knip.jsonc"
        - "**/tsconfig*.json"
        - "**/*.{ts,tsx}"
      run: pnpm exec knip

    test:
      glob:
        - "package.json"
        - "pnpm-lock.yaml"
        - "**/*.{ts,tsx}"
      run: pnpm run test --browser.headless

pre-push:
  skip:
    - rebase
  commands:
    build:
      run: pnpm run build
